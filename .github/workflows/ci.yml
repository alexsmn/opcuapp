# CI for the published `opcuapp` product (github.com/alexsmn/opcuapp).
#
# opcuapp had no CI at all until 2026-09-26. It consumes one other product,
# `net`, which a standalone build resolves as a SIBLING directory named after
# the product (build-support/ScadaProducts.cmake resolves `../net`). `net`
# publishes as `transport`, so its checkout names `path: net` explicitly -- the
# directory name is what matters, never the repository's. Everything else is
# the product's own presets and its own vcpkg.json, resolved by the toolchain
# during configure (ADR 0011).
#
# The sibling checkout is `transport`'s main, not a pinned commit: the monorepo
# publishes both from one commit, so their mains move together, and a pin here
# would go stale on the next export.
#
# There is no `continue-on-error` anywhere in this file, on purpose. A build
# job that is allowed to fail is decoration: core's matrix was exactly that
# until 2026-09-27 (superproject tasks.md 316).

name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
          - name: Ubuntu / GCC
            # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from
            # 2026-10-19 (actions/runner-images#14748), and GCC 14 and the apt
            # packages this leg installs were checked against 24.04.
            os: ubuntu-24.04
          - name: macOS / AppleClang
            os: macos-latest

    env:
      # A plain directory carried between runs by the restore/save steps below.
      # Not `x-gha`: vcpkg has removed that backend.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
    - name: Check out opcuapp
      uses: actions/checkout@v7
      with:
        path: opcuapp

    # Publishes as `transport`; the directory must be `net`.
    - name: Check out transport (the `net` product)
      uses: actions/checkout@v7
      with:
        repository: alexsmn/transport
        path: net

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    # GCC 14, not the runner's default GCC 13. GCC 13.3 hits an internal
    # compiler error -- `in build_special_member_call, at cp/call.cc:11096` --
    # on coroutine code this build compiles (opcuapp's
    # client_protocol_session.cpp:574 and client_protocol_subscription.cpp:118,
    # core's monitored_item_service_awaitable.cpp:60). It is deterministic, not
    # load: reproduced serially on an idle container, and on opcuapp's first CI
    # run (opcuapp run 36282517652); g++-14.2 compiles all three cleanly.
    # The superproject backlog's 709 recorded the investigation. The ubuntu-24.04 image
    # ships 12.4, 13.3 and 14.2 side by side (actions/runner-images,
    # images/ubuntu/Ubuntu2404-Readme.md, checked 2026-09-26), so this only
    # selects one. Set before vcpkg runs, so its ports build with it too.
    - name: Select GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Install Ninja (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    # The presets carry no `environment` block (ADR 0011), so the MSVC
    # toolchain has to be in the environment before cmake runs. Ninja comes
    # with Visual Studio.
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # The commit the monorepo's own vcpkg is at, the same pin the client's and
    # transport's workflows carry, so CI resolves the ports a developer does.
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'f3e10653cc27d62a37a3763cd84b38bca07c6075'
        runVcpkgInstall: false

    - name: Create the binary cache directory
      run: cmake -E make_directory "${{ github.workspace }}/vcpkg-cache"

    - name: Restore the vcpkg binary cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('opcuapp/vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-${{ hashFiles('opcuapp/vcpkg.json') }}-
          vcpkg-${{ matrix.os }}-

    - name: Configure
      working-directory: opcuapp
      run: cmake --preset ninja

    # `-k 0`: keep going past a failed compile, so one run reports every
    # platform-specific error instead of stopping at the first. The Windows
    # leg found them one per run otherwise (opcuapp runs 36282517652 and
    # 36283768898, each stopping on a different MSVC-only error).
    - name: Build (Release)
      working-directory: opcuapp
      run: cmake --build --preset release -- -k 0

    # Saved even when the build fails, so the ports that did build survive.
    - name: Save the vcpkg binary cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('opcuapp/vcpkg.json') }}-${{ github.run_id }}

    # Every test the executable lists must be one ctest registered. Windows
    # built opcuapp_unittests and then ran only net's 41 tests, reporting
    # success, twice -- under PRE_TEST discovery (run 36285521173) and again
    # under POST_BUILD (run 36291936470) -- so a green ctest is no evidence
    # the suite ran. This compares the two counts, and prints the listing's
    # head and exit code so the next failure explains itself.
    - name: Check the whole suite is registered
      working-directory: opcuapp
      shell: bash
      run: |
        exe=build/ninja/bin/Release/opcuapp_unittests
        set +e
        "$exe" --gtest_list_tests > list.txt 2> list.err
        rc=$?
        set -e
        echo "--gtest_list_tests exit code: $rc"
        head -5 list.txt; head -5 list.err
        listed=$(grep -c '^  ' list.txt || true)
        registered=$(ctest --preset test-release -N | sed -n 's/^Total Tests: //p')
        echo "opcuapp_unittests lists $listed; ctest registered $registered (net's included)"
        if [ "$rc" -ne 0 ] || [ "$listed" -eq 0 ] || [ "$registered" -lt "$listed" ]; then
          echo "::error::opcuapp's tests are not all registered with ctest"
          exit 1
        fi

    # Runs net's tests as well as opcuapp's: the consumed product is built
    # into this tree, and its suite is registered with it.
    #
    # `--timeout 300` bounds each test: the first Windows run to actually
    # execute this suite hung in it for three hours with no output (run
    # 36294274124), and without a per-test bound a hang is killed only by the
    # six-hour job limit, naming nothing.
    - name: Test (Release)
      working-directory: opcuapp
      run: ctest --preset test-release --output-on-failure --timeout 300
